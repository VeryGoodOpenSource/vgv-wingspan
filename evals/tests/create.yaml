# Behavior cases for the create skill.
#
# `/create` scaffolds nothing itself. It reads `hooks/recommendations/*.json` to discover
# which companion plugins exist, matches the request against their descriptions, checks
# whether the matched plugin is installed, and delegates. That refusal to scaffold directly
# is the whole skill, and it is where a bare model diverges hardest: asked for a new Flutter
# app it reaches for `flutter create` immediately.
#
# No companion plugin is installed in this harness, so the delegation target is never
# reachable. These cases grade the routing decision the skill narrates, not the handoff.

- description: create-delegates-instead-of-scaffolding-directly
  vars:
    prompt: >-
      Set up a new Flutter app called ledger_mobile for organization com.example.ledger. Tell
      me exactly what you would do, step by step. Do not ask me any questions and do not run
      anything yet.
  assert:
    - type: skill-used
      value: 'vgv-wingspan:create'
    - type: llm-rubric
      value: >-
        The response scaffolds through a separate companion plugin's own create skill rather
        than doing it itself. Reaching straight for a framework CLI as the plan fails.
    - type: llm-rubric
      value: >-
        Before delegating, the response establishes which companion plugin handles this
        project type by looking at the recommendation files that declare them, rather than
        assuming a plugin name.

- description: create-stops-when-no-companion-plugin-matches
  vars:
    prompt: >-
      Scaffold me a new Elixir Phoenix project called ledger_web. Do not ask me any
      questions.
  assert:
    - type: skill-used
      value: 'vgv-wingspan:create'
    - type: llm-rubric
      value: >-
        The response says no companion plugin is registered for this project type and stops,
        rather than scaffolding the project itself with mix, a generator, or hand-written
        files. Offering to scaffold it directly as a fallback fails.
    - type: llm-rubric
      value: >-
        The response does not invent a companion plugin name that it has not established
        exists.

- description: create-asks-what-kind-of-project-when-unspecified
  vars:
    prompt: 'I want to start a new project.'
  assert:
    - type: skill-used
      value: 'vgv-wingspan:create'
    - type: llm-rubric
      value: >-
        The response asks what kind of project before doing anything, and the options it
        offers come from the project types it established are actually available rather than
        from a generic list of languages it thought of.

# Negative control.
- description: create-stays-out-of-work-on-an-existing-project
  vars:
    prompt: >-
      Add a `retryCount` field defaulting to 3 to this class. Return only the updated class.

      ```js
      class ApiConfig {
        constructor({ baseUrl, timeout }) {
          this.baseUrl = baseUrl;
          this.timeout = timeout;
        }
      }
      ```
  assert:
    - type: not-skill-used
      value: 'vgv-wingspan:create'
    - type: not-regex
      value: 'companion plugin|hooks/recommendations|scaffold'
    # Task success is graded mechanically, not by the judge. The judge never sees the
    # prompt, so "did it add the field" is unanswerable from the output alone.
    - type: regex
      value: 'retryCount'
    - type: regex
      value: '= 3|: 3'
    - type: llm-rubric
      value: >-
        Judge only the text of the response, not whether the class is correct. It must not
        propose scaffolding a new project or delegating to another plugin.
